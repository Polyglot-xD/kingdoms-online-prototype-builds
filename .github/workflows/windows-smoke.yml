name: Windows release smoke test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  launch-host:
    runs-on: windows-2025
    timeout-minutes: 12
    steps:
      - name: Download and verify release
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $url = 'https://github.com/Polyglot-xD/kingdoms-online-prototype-builds/releases/download/v0.1.1-windows/KingdomsOnline-Windows-x64-v0.1.1.zip'
          Invoke-WebRequest -Uri $url -OutFile game.zip
          $actual = (Get-FileHash game.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          $expected = '8c75ed477756e498bc71a738a624f0c43a4646392e01da74e768e4812e443be7'
          if ($actual -ne $expected) { throw "Checksum mismatch: $actual" }
          Expand-Archive game.zip -DestinationPath game
          if (!(Test-Path game/KingdomsOnline.exe)) { throw 'KingdomsOnline.exe missing from release' }

      - name: Launch default single-player host
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $log = Join-Path $pwd 'windows-player.log'
          $process = Start-Process -FilePath "$pwd/game/KingdomsOnline.exe" -ArgumentList @('-batchmode', '-nographics', '-logFile', $log) -PassThru
          try {
            $ready = $false
            for ($i = 0; $i -lt 90; $i++) {
              Start-Sleep -Seconds 1
              if ($process.HasExited) { throw "Player exited early with code $($process.ExitCode)" }
              if ((Test-Path $log) -and (Select-String -Path $log -Pattern 'Server listening on port 7777' -Quiet)) {
                $ready = $true
                break
              }
            }
            if (!$ready) { throw 'Default launch never started the local authoritative host' }
            $worldReady = $false
            for ($i = 0; $i -lt 90; $i++) {
              Start-Sleep -Seconds 1
              if ($process.HasExited) { throw "Player exited during world startup with code $($process.ExitCode)" }
              if (Select-String -Path $log -Pattern '\[GrandRail\].*citizens online' -Quiet) {
                $worldReady = $true
                break
              }
            }
            if (!$worldReady) { throw 'Persistent economy/world startup marker was not observed' }
            $localJoined = $false
            for ($i = 0; $i -lt 45; $i++) {
              Start-Sleep -Seconds 1
              if ($process.HasExited) { throw "Player exited before its local client joined with code $($process.ExitCode)" }
              if (Select-String -Path $log -Pattern '\[ScaleNet\] connections=1\b' -Quiet) {
                $localJoined = $true
                break
              }
            }
            if (!$localJoined) { throw 'Host world started, but the default local player never registered with it' }
            $fatalPatterns = @('NullReferenceException', 'Unhandled Exception', 'Crash!!!', 'Aborting batchmode')
            foreach ($pattern in $fatalPatterns) {
              if (Select-String -Path $log -Pattern $pattern -SimpleMatch -Quiet) {
                throw "Fatal startup marker found in Windows log: $pattern"
              }
            }
            Get-Content $log -Tail 120
          }
          finally {
            if (!$process.HasExited) { Stop-Process -Id $process.Id -Force }
          }

      - name: Prove world persistence across restart
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $token = "gha-$env:GITHUB_RUN_ID"
          $writeLog = Join-Path $pwd 'windows-persistence-write.log'
          $readLog = Join-Path $pwd 'windows-persistence-read.log'
          $writer = Start-Process -FilePath "$pwd/game/KingdomsOnline.exe" -ArgumentList @('-batchmode', '-nographics', '-persistence-smoke-write', $token, '-logFile', $writeLog) -Wait -PassThru
          if ($writer.ExitCode -ne 0) { throw "Persistence writer exited with code $($writer.ExitCode)" }
          if (!(Select-String -Path $writeLog -Pattern "[PersistenceSmoke] wrote token=$token" -SimpleMatch -Quiet)) {
            throw 'First launch did not atomically write the persistence token'
          }
          $reader = Start-Process -FilePath "$pwd/game/KingdomsOnline.exe" -ArgumentList @('-batchmode', '-nographics', '-persistence-smoke-read', $token, '-logFile', $readLog) -Wait -PassThru
          if ($reader.ExitCode -ne 0) { throw "Persistence reader exited with code $($reader.ExitCode)" }
          if (!(Select-String -Path $readLog -Pattern "[Persistence] Loaded revision" -SimpleMatch -Quiet)) {
            throw 'Second launch did not load a local world snapshot'
          }
          if (!(Select-String -Path $readLog -Pattern "[PersistenceSmoke] restored token=$token" -SimpleMatch -Quiet)) {
            throw 'Second launch loaded a snapshot but did not restore the saved world token'
          }
          Get-Content $writeLog -Tail 40
          Get-Content $readLog -Tail 60

      - name: Upload Windows startup log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-startup-log
          path: |
            windows-player.log
            windows-persistence-write.log
            windows-persistence-read.log
          if-no-files-found: warn
